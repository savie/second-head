name: SH Runtime Deploy DEV

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'functions/runtime-p4a-001/**'
      - '.github/workflows/sh-runtime-deploy.yml'

jobs:
  deploy-runtime:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Verify deployment secret
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy runtime-p4a-001
        run: supabase functions deploy runtime-p4a-001 --project-ref pkhkgvsrqeupvwoqjwmd

      - name: Verify deployed function is reachable
        run: |
          curl --fail --silent --show-error \
            -X OPTIONS \
            "https://pkhkgvsrqeupvwoqjwmd.supabase.co/functions/v1/runtime-p4a-001" \
            >/dev/null
