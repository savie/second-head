name: SH App Chat Verification

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - '.github/workflows/sh-app-chat-verification.yml'

jobs:
  app-chat-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck app
        run: npm run typecheck

      - name: Verify chat request response contract
        run: node tests/chat-request-response-contract.mjs
