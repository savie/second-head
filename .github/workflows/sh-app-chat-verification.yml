# P6E final authenticated verification workflow
name: SH App Chat Verification

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - 'functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/sh-app-chat-verification.yml'
      - 'docs/evidence/EV-APP-005_CHAT_REQUEST_RESPONSE_VERTICAL_SLICE.md'

jobs:
  app-chat-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck app
        run: npm run typecheck
      - name: Verify chat request response contract
        run: node tests/chat-request-response-contract.mjs
      - name: Verify authenticated runtime response
        env:
          SUPABASE_URL: ${{ secrets.SH_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SH_SUPABASE_ANON_KEY }}
          SH_TEST_EMAIL: ${{ secrets.SH_TEST_EMAIL }}
          SH_TEST_PASSWORD: ${{ secrets.SH_TEST_PASSWORD }}
        run: node tests/runtime-invocation-verification.mjs
      - name: Verify authenticated runtime streaming
        env:
          SH_SUPABASE_URL: ${{ secrets.SH_SUPABASE_URL }}
          SH_SUPABASE_ANON_KEY: ${{ secrets.SH_SUPABASE_ANON_KEY }}
          SH_TEST_EMAIL: ${{ secrets.SH_TEST_EMAIL }}
          SH_TEST_PASSWORD: ${{ secrets.SH_TEST_PASSWORD }}
        run: node tests/runtime-streaming-verification.mjs
      - name: Verify Recovery round-trip and portability
        env:
          SUPABASE_URL: ${{ secrets.SH_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SH_SUPABASE_ANON_KEY }}
          SH_TEST_EMAIL: ${{ secrets.SH_TEST_EMAIL }}
          SH_TEST_PASSWORD: ${{ secrets.SH_TEST_PASSWORD }}
        run: node tests/recovery-roundtrip-verification.mjs
      - name: Verify authenticated Recovery Journey recorder
        env:
          SUPABASE_URL: ${{ secrets.SH_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SH_SUPABASE_ANON_KEY }}
          SH_TEST_EMAIL: ${{ secrets.SH_TEST_EMAIL }}
          SH_TEST_PASSWORD: ${{ secrets.SH_TEST_PASSWORD }}
        run: node tests/recovery-journey-authenticated-verification.mjs
