name: SH App Android Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - '.github/workflows/sh-app-android-build.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SH_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SH_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify public Expo configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Reconcile Expo dependencies
        run: npx expo install --fix

      - name: Typecheck
        run: npm run typecheck

      - name: Generate clean Android native project
        env:
          CI: 1
        run: npx expo prebuild --clean --platform android

      - name: Verify Expo autolinking
        run: npx expo-modules-autolinking verify

      - name: Verify generated Gradle project
        run: |
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -x android/gradlew

      - name: Build Android release APK with embedded JS bundle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Locate release APK and JS bundle
        run: |
          echo "APK candidates:"
          find android/app/build/outputs -type f -name '*.apk' -print
          echo "JS bundle candidates:"
          find android/app/build -type f -name 'index.android.bundle' -print
          APK_PATH="$(find android/app/build/outputs -type f -name '*.apk' | head -n 1)"
          BUNDLE_PATH="$(find android/app/build -type f -name 'index.android.bundle' | head -n 1)"
          test -n "$APK_PATH"
          test -f "$APK_PATH"
          test -n "$BUNDLE_PATH"
          test -f "$BUNDLE_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/sh-app-release.apk
          test -f dist/sh-app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sh-app-release-apk
          path: app/dist/sh-app-release.apk
          if-no-files-found: error

# Current-candidate release build marker: intentionally triggers the final dev APK build.
