name: SH App Android Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - '.github/workflows/sh-app-android-build.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Reconcile Expo dependencies
        run: npx expo install --fix

      - name: Typecheck
        run: npm run typecheck

      - name: Generate clean Android native project
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Verify Expo autolinking
        run: npx expo-modules-autolinking verify --verbose

      - name: Verify generated Gradle project
        run: |
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -x android/gradlew

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sh-app-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
