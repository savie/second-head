name: SH App Android Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - '.github/workflows/sh-app-android-build.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SH_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SH_SUPABASE_ANON_KEY }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify public Expo configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Reconcile Expo dependencies
        run: npx expo install --fix

      - name: Typecheck
        run: npm run typecheck

      - name: Generate clean Android native project
        env:
          CI: 1
        run: npx expo prebuild --clean --platform android

      - name: Verify Expo autolinking
        run: npx expo-modules-autolinking verify

      - name: Verify generated Gradle project
        run: |
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -x android/gradlew

      - name: Build Android release APK with embedded JS bundle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify release APK and embedded JS bundle
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/generated/assets/react/release/index.android.bundle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sh-app-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
