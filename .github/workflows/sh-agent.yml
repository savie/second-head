name: SH Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "SH Agent task"
        required: true
        default: "inspect repository state"
      scope:
        description: "Allowed scope"
        required: true
        default: "docs/"

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "second-head-agent"
          git config user.email "second-head-agent@users.noreply.github.com"

      - name: Validate branch
        run: |
          test "$(git branch --show-current)" = "dev"

      - name: Receive task
        env:
          SH_TASK: ${{ inputs.task }}
          SH_SCOPE: ${{ inputs.scope }}
        run: |
          echo "Task: $SH_TASK"
          echo "Scope: $SH_SCOPE"

      - name: Run SH executor
        env:
          SH_TASK: ${{ inputs.task }}
          SH_SCOPE: ${{ inputs.scope }}
        run: |
          chmod +x .agent/execute_task.sh
          .agent/execute_task.sh

      - name: Agent workspace check
        run: |
          git status
          git diff --stat

      - name: Commit and push changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "SH agent update"
          git push origin dev
