name: SH Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "SH Agent task"
        required: true
        default: "inspect repository state"
      scope:
        description: "Allowed change scope"
        required: false
        default: "docs/working"

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Verify branch
        run: |
          test "$(git branch --show-current)" = "dev"

      - name: Configure git identity
        run: |
          git config user.name "second-head-agent"
          git config user.email "second-head-agent@users.noreply.github.com"

      - name: Receive task
        run: |
          echo "Task: ${{ inputs.task }}"
          echo "Scope: ${{ inputs.scope }}"

      - name: Agent workspace inspection
        run: |
          git status
          git diff --stat

      - name: Agent workspace ready
        run: |
          echo "SH Agent ready"

      - name: Commit and push changes
        run: |
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "SH agent update"
          git push origin dev
