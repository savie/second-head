name: SH Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "SH Agent task"
        required: true
        default: "inspect repository state"
      scope:
        description: "Allowed scope"
        required: true
        default: "docs/"
      operation:
        description: "Operation"
        required: true
        default: "INSPECT"
      target_file:
        description: "Target file for EDIT"
        required: false
        default: ""
      old_text:
        description: "Text to replace"
        required: false
        default: ""
      new_text:
        description: "Replacement text"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "second-head-agent"
          git config user.email "second-head-agent@users.noreply.github.com"

      - name: Validate branch
        run: |
          test "$(git branch --show-current)" = "dev"

      - name: Run SH executor
        env:
          TASK: ${{ inputs.task }}
          SCOPE: ${{ inputs.scope }}
          OPERATION: ${{ inputs.operation }}
          TARGET_FILE: ${{ inputs.target_file }}
          OLD_TEXT: ${{ inputs.old_text }}
          NEW_TEXT: ${{ inputs.new_text }}
        run: |
          chmod +x .agent/execute_task.sh
          .agent/execute_task.sh

      - name: Agent workspace check
        run: |
          git status
          git diff --stat

      - name: Commit and push changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "SH agent update"
          git push origin dev
