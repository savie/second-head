name: SH Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "SH Agent task"
        required: true
        default: "inspect repository state"

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "second-head-agent"
          git config user.email "second-head-agent@users.noreply.github.com"

      - name: Receive task
        run: |
          echo "Task: ${{ inputs.task }}"

      - name: Agent workspace ready
        run: |
          echo "SH Agent ready"
          git status

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "SH agent update" || true
          git push
