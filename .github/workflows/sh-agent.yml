name: SH Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "second-head-agent"
          git config user.email "second-head-agent@users.noreply.github.com"

      - name: Agent workspace ready
        run: |
          echo "SH Agent ready"

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "SH agent update" || true
          git push
