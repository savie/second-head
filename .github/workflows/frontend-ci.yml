name: Frontend CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android build scaffolding
        run: |
          cp -R . /tmp/second-head-build
          flutter create --platforms=android --org com.secondhead --project-name app --no-pub /tmp/second-head-build
          cp -R /tmp/second-head-build/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}
