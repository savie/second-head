name: Frontend CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android build scaffolding
        run: |
          cp -R . /tmp/second-head-build
          flutter create --platforms=android --org com.secondhead --project-name app --no-pub /tmp/second-head-build
          cp -R /tmp/second-head-build/android ./android
          sed -i 's/android:label="app"/android:label="SECOND HEAD"/' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp assets/brand/unity.png android/app/src/main/res/drawable/sh_launcher.png
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/sh_launcher"#' android/app/src/main/AndroidManifest.xml

      - name: Generate stable DEV signing key
        shell: bash
        env:
          SH_DEV_SIGNING_SEED: ${{ secrets.SH_DEV_SIGNING_SEED }}
        run: |
          set -euo pipefail
          if [[ -z "${SH_DEV_SIGNING_SEED:-}" ]]; then
            echo "SH_DEV_SIGNING_SEED GitHub Actions secret is required for DEV APK signing."
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check --quiet cryptography
          python3 scripts/generate_dev_signing_keystore.py "$HOME/.android/debug.keystore" > /tmp/sh-dev-signing-fingerprint
          chmod 600 "$HOME/.android/debug.keystore"
          echo "DEV signing certificate SHA-256: $(cat /tmp/sh-dev-signing-fingerprint)"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Alias name:|SHA256:'

      - name: Configure explicit DEV signing
        run: python3 scripts/configure_dev_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Verify APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat /tmp/sh-dev-signing-fingerprint)"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "apksigner not found in Android SDK build-tools."
            exit 1
          fi
          actual="$("$apksigner_path" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual" ]]; then
            echo "Could not read APK signing certificate fingerprint."
            exit 1
          fi
          echo "Expected DEV signing SHA-256: $expected"
          echo "APK signing SHA-256:         $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "SIGNING IDENTITY MISMATCH - refusing to publish APK."
            exit 1
          fi
          echo "Signing identity verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: second-head-debug-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
