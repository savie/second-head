name: Workspace Bootstrap Smoke

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: bootstrap-source

      - name: Run FULL bootstrap in isolated HOME
        env:
          HOME: ${{ runner.temp }}/sh-home
        run: |
          rm -rf "$HOME"
          mkdir -p "$HOME"
          bash "$GITHUB_WORKSPACE/bootstrap-source/devtools/bootstrap.sh" \
            --profile FULL \
            --repo-dir "$HOME/second-head"

      - name: Verify bootstrap result
        env:
          HOME: ${{ runner.temp }}/sh-home
        run: |
          set -u
          fail() { echo "BOOTSTRAP VERIFICATION FAILED: $1" >&2; exit 1; }
          test -f "$HOME/second-head/app/.dart_tool/package_config.json" || fail "Flutter package config missing"
          command -v flutter >/dev/null 2>&1 || fail "flutter command missing"
          flutter --version >/dev/null 2>&1 || fail "flutter execution failed"
          command -v adb >/dev/null 2>&1 || fail "adb command missing"
          adb version >/dev/null 2>&1 || fail "adb execution failed"
          command -v supabase >/dev/null 2>&1 || fail "supabase command missing"
          command -v psql >/dev/null 2>&1 || fail "psql command missing"
          test "$(git -C "$HOME/second-head" branch --show-current)" = "dev" || fail "repository is not on dev"
          test -z "$(git -C "$HOME/second-head" status --porcelain)" || fail "repository working tree is dirty"
          test -f "$HOME/.second-head/env.sh" || fail "generated env.sh missing"
          grep -q '^export ANDROID_SDK_ROOT=' "$HOME/.second-head/env.sh" || fail "ANDROID_SDK_ROOT missing from env.sh"
          grep -q '^export ANDROID_HOME=' "$HOME/.second-head/env.sh" || fail "ANDROID_HOME missing from env.sh"
          . "$HOME/.second-head/env.sh"
          test -n "${ANDROID_SDK_ROOT:-}" || fail "ANDROID_SDK_ROOT is empty after sourcing env.sh"
          test -d "$ANDROID_SDK_ROOT" || fail "ANDROID_SDK_ROOT does not exist: $ANDROID_SDK_ROOT"

      - name: Run bootstrap again to verify idempotency
        env:
          HOME: ${{ runner.temp }}/sh-home
        run: |
          bash "$GITHUB_WORKSPACE/bootstrap-source/devtools/bootstrap.sh" \
            --profile FULL \
            --repo-dir "$HOME/second-head"
          test "$(git -C "$HOME/second-head" branch --show-current)" = "dev"
          test -z "$(git -C "$HOME/second-head" status --porcelain)"

      - name: Verify dirty-worktree safety
        env:
          HOME: ${{ runner.temp }}/sh-home
        run: |
          printf '%s\n' 'bootstrap safety fixture' > "$HOME/second-head/BOOTSTRAP_SAFETY_MARKER"
          git -C "$HOME/second-head" add BOOTSTRAP_SAFETY_MARKER
          git -C "$HOME/second-head" -c user.name='bootstrap-test' -c user.email='bootstrap-test@example.invalid' commit -m 'test fixture: bootstrap safety' >/dev/null
          printf '%s\n' 'uncommitted bootstrap safety fixture' >> "$HOME/second-head/BOOTSTRAP_SAFETY_MARKER"
          set +e
          bash "$GITHUB_WORKSPACE/bootstrap-source/devtools/bootstrap.sh" \
            --profile FULL \
            --repo-dir "$HOME/second-head"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '^uncommitted bootstrap safety fixture$' "$HOME/second-head/BOOTSTRAP_SAFETY_MARKER"
          test "$(git -C "$HOME/second-head" branch --show-current)" = "dev"
